# This is a Databricks asset bundle definition for superstore_medallionarchitecture_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: superstore_medallionarchitecture_dab
  # name:superstore_data_platform
  uuid: 1e5129cf-522e-4d2a-a430-8c5928f2dbbe

include:
  - resources/superstore_lakehouse_job.job.yml
  - resources/integration_test_job.job.yml
  - resources/superstore_freshness_alert.alert.yml
  - resources/superstore_data_quality_alerts.alert.yml
  - resources/superstore_dashboards.dashboard.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  SUPERSTORE_ENV:
    description: Environment of the pipeline (dev/qa/prod)
  SUPERSTORE_PIPELINE_NAME:
    description: Name of the pipeline
  SUPERSTORE_PIPELINE_VERSION:
    description: Version of the Superstore pipeline

  # Run mode variables.
  # incremental (default) | backfill | replay | full_refresh — see the job
  # description in resources/superstore_lakehouse_job.job.yml for semantics.
  run_mode:
    description: Run mode (incremental | backfill | replay | full_refresh)
    default: "incremental"
  start_date:
    description: Start date for backfill/replay (YYYY-MM-DD)
    default: ""
  end_date:
    description: End date for backfill/replay (YYYY-MM-DD, defaults to today)
    default: ""
  dry_run:
    description: Dry-run mode (true | false)
    default: "false"

  # ---------------------------------------------------------------------------
  # Workspace-specific identities and endpoints, resolved BY NAME.
  #
  # These used to be hardcoded IDs (a Slack destination UUID, a warehouse ID,
  # two service-principal application IDs), so the repo deployed only to the
  # workspace they came from. A lookup resolves the name to that workspace's
  # own ID at deploy time: to deploy elsewhere, create objects with these
  # names (see README -> Getting started) -- no YAML edit needed beyond the
  # workspace host and operator_email.
  # ---------------------------------------------------------------------------
  operator_email:
    description: The person who receives alert emails and keeps CAN_MANAGE on shared environments
    default: bireshmoktan@gmail.com
  alerts_destination_id:
    description: Databricks notification destination (Slack channel) for job failures and SQL alerts
    lookup:
      notification_destination: superstore-data-platform-alerts
  sql_warehouse_id:
    description: SQL warehouse the SQL alerts evaluate on
    lookup:
      warehouse: Serverless Starter Warehouse
  qa_service_principal:
    description: Application ID of the service principal that deploys and runs qa
    lookup:
      service_principal: superstore-ci-qa
  prod_service_principal:
    description: Application ID of the service principal that deploys and runs prod
    lookup:
      service_principal: superstore-ci-prod

targets:
  dev:
    mode: development
    default: true
    workspace:
      # host: http://127.0.0.1:7073
      host: https://dbc-081a6a55-88cd.cloud.databricks.com
      root_path: ~/superstore_dev_environment/.bundle/${bundle.name}/${bundle.target}

    resources:
      alerts:
        superstore_freshness:
          # Freshness presupposes a cadence. Only prod is scheduled, so in dev
          # and qa this alert would report "stale" every day forever and train
          # the reader to ignore it. Paused rather than deleted so the three
          # environments keep one definition.
          schedule:
            pause_status: PAUSED
        # The data quality alerts are paused outside prod for a different
        # reason: dev and qa data is test data. The integration suite DELIBERATELY
        # sends a new column and dirty rows, so these would fire on purpose every
        # run. Their queries were exercised against that data before deploying.
        superstore_dq_reconciliation:
          schedule:
            pause_status: PAUSED
        superstore_dq_orphaned_facts:
          schedule:
            pause_status: PAUSED
        superstore_dq_schema_drift:
          schedule:
            pause_status: PAUSED
        superstore_dq_placeholder_growth:
          schedule:
            pause_status: PAUSED

    presets:
      source_linked_deployment: false
    variables:
      catalog: superstore_catalog
      schema: dev
      run_mode: "incremental"  # Safe default
      start_date: ""
      end_date: ""
      dry_run: "false"  # Changed from "true" - normal runs should process data
      SUPERSTORE_ENV: dev
      SUPERSTORE_PIPELINE_NAME: superstore_etl_pipeline_dev
      SUPERSTORE_PIPELINE_VERSION: "1.0"

  qa:
    # qa is a shared environment deployed by CI as its own service principal,
    # superstore-ci-qa -- the same shape as prod, with a separate identity that
    # holds nothing in prod. See docs/NON_PROD_IDENTITY.md.
    #
    # production, not development: development mode prefixes every job with the
    # deploying identity's name ("[dev bireshmoktan] ...") and is meant for one
    # person's copy. Its one useful side effect -- pausing schedules -- is now
    # done explicitly below, for qa only.
    mode: production
    workspace:
      host: https://dbc-081a6a55-88cd.cloud.databricks.com
      # A shared folder, created by an admin and handed to the service principal
      # (governance/manual_grants/qa_ci_service_principal_workspace_permissions.sh).
      # It used to be ~/..., i.e. the deploying person's home folder. The
      # existing qa jobs were moved here with `bundle deployment bind`, so their
      # IDs and run history were kept.
      root_path: /Workspace/superstore_qa_environment/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.qa_service_principal}   # superstore-ci-qa
    permissions:
      - user_name: ${var.operator_email}
        level: CAN_MANAGE
      - service_principal_name: ${var.qa_service_principal}
        level: CAN_MANAGE
    resources:
      jobs:
        superstore_data_platform:
          # Development mode used to pause this schedule implicitly. In
          # production mode it would run weekly, so qa pauses it explicitly --
          # here, in the qa target only. Setting pause_status in the shared job
          # YAML instead would apply to every target; that mistake once
          # scheduled dev (see README -> CI/CD, "Schedule").
          schedule:
            pause_status: PAUSED
      alerts:
        superstore_freshness:
          # Freshness presupposes a cadence. Only prod is scheduled, so in dev
          # and qa this alert would report "stale" every day forever and train
          # the reader to ignore it. Paused rather than deleted so the three
          # environments keep one definition.
          schedule:
            pause_status: PAUSED
        # The data quality alerts are paused outside prod for a different
        # reason: dev and qa data is test data. The integration suite DELIBERATELY
        # sends a new column and dirty rows, so these would fire on purpose every
        # run. Their queries were exercised against that data before deploying.
        superstore_dq_reconciliation:
          schedule:
            pause_status: PAUSED
        superstore_dq_orphaned_facts:
          schedule:
            pause_status: PAUSED
        superstore_dq_schema_drift:
          schedule:
            pause_status: PAUSED
        superstore_dq_placeholder_growth:
          schedule:
            pause_status: PAUSED

    presets:
      source_linked_deployment: false
    variables:
      catalog: superstore_catalog
      schema: qa
      run_mode: "incremental"
      start_date: ""
      end_date: ""
      dry_run: "false"
      SUPERSTORE_ENV: qa
      SUPERSTORE_PIPELINE_NAME: superstore_etl_pipeline_qa
      SUPERSTORE_PIPELINE_VERSION: "1.0"

  prod:
    mode: production
    # Prod jobs execute as the CI service principal, so every prod read and
    # write is attributed to the pipeline rather than to a person. It is the
    # same identity that deploys prod (deploy.yml), which is why no
    # "Service Principal: User" role is needed: an identity may always run as
    # itself. Its grants are in governance/manual_grants/.
    run_as:
      service_principal_name: ${var.prod_service_principal}
    workspace:
      # host: http://127.0.0.1:7073
      host: https://dbc-081a6a55-88cd.cloud.databricks.com
      # A shared folder outside any person's home, so prod does not depend on who deploys.
      root_path: /Workspace/superstore_prod_environment/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: superstore_catalog
      schema: prod
      run_mode: "incremental"
      start_date: ""
      end_date: ""
      dry_run: "false"
      SUPERSTORE_ENV: prod
      SUPERSTORE_PIPELINE_NAME: superstore_etl_pipeline_prod
      SUPERSTORE_PIPELINE_VERSION: "1.0"
    permissions:
      - user_name: ${var.operator_email}
        level: CAN_MANAGE

      # superstore-ci-prod deploys prod (deploy.yml) and owns the prod jobs.
      # Ownership was transferred to it once by a workspace admin: a bundle
      # deploy cannot do that itself, because only admins may change a job's
      # owner, and the service principal is deliberately not an admin.
      # See docs/CI_SERVICE_PRINCIPAL.md.
      - service_principal_name: ${var.prod_service_principal}
        level: CAN_MANAGE
