# ==============================================================================
# Integration Tests - E2E Validation on QA
# ==============================================================================
# Runs AFTER deploy.yml successfully deploys QA. Tests the real pipeline
# end-to-end: Bronze → Silver → Gold with assertions at each layer.
#
# Runtime: 40-42 min on Databricks across the four green runs since the DAG
# last changed (2026-08-21).
#
# Three timeouts, nested on purpose: the Databricks job stops itself at 90 min
# (timeout_seconds in resources/integration_test_job.job.yml), this workflow
# waits up to 100, and GitHub kills the job at 110. Innermost first means a
# stuck run ends as a Databricks TIMEDOUT that the result check below names,
# rather than GitHub cancelling the job while the run carries on.
#
# Pass/fail is judged on result_state, not on the CLI's exit code. `databricks
# bundle run` (CLI v0.295.0, bundle/run/job.go) exits 0 on SUCCESS_WITH_FAILURES
# -- the state falls through to a `// TODO: handle other result states` branch.
# Until 2026-08-21 the suite ended in an ALL_DONE cleanup task, so any failed
# assertion produced exactly that state: runs with up to 11 failed tasks
# reported "succeeded", the CLI exited 0, and any of them started from here
# would have printed "passed". Removing the cleanup
# fixed it by accident; this check fixes it on purpose, whatever the DAG shape.
#
# Philosophy: Fail fast, no retries. If integration tests fail, QA is broken
# and needs immediate human investigation, not automatic retries that mask the
# root cause.
# ==============================================================================

name: Integration Tests (Databricks)

on:
  workflow_run:
    workflows: ["Superstore Data Platform CI/CD"]
    types: [completed]
    branches: [qa]

jobs:
  integration-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # SHARED with deploy-qa (deploy.yml): one thing touches qa at a time.
    #
    # Before this, overlapping work waited INSIDE Databricks, and two things
    # went wrong on 2026-10-01 when two qa pushes landed 10 minutes apart:
    #   - the second test queued behind the first (max_concurrent_runs: 1) and
    #     its first task's 30-min timeout expired while it was still queued --
    #     "timed out before the task was started" -- a false failure;
    #   - the second push's deploy replaced qa's code while the first test was
    #     running, so that test ran a mix of two commits.
    # Waiting now happens here, in GitHub, where nothing times out, and each
    # test runs against exactly one deployed commit. The group name must match
    # deploy-qa exactly. See docs/CI_CONCURRENCY.md.
    concurrency:
      group: qa-environment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 110  # Outermost of three nested timeouts -- see header.
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0
      
      # Run integration tests (no retry - fail fast on real issues).
      # Judged on result_state, not the CLI exit code -- see header.
      - name: Run integration test job
        run: |
          JOB_ID=$(databricks bundle summary --target qa -o json \
            | jq -r '.resources.jobs.superstore_integration_test.id')

          RUN=$(databricks jobs run-now "$JOB_ID" --timeout 100m -o json)
          RESULT=$(echo "$RUN" | jq -r '.state.result_state')

          echo "Run:    $(echo "$RUN" | jq -r '.run_page_url')"
          echo "Result: $RESULT"

          # Allowlist, not blocklist: any state other than SUCCESS fails,
          # including ones Databricks has not added yet.
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "::error::Integration test ended $RESULT, not SUCCESS"
            echo "$RUN" | jq -r '.tasks[]
              | select(.state.result_state != "SUCCESS")
              | "  \(.task_key) (attempt \(.attempt_number // 0)): \(.state.result_state)"'
            exit 1
          fi
          echo "✅ Integration tests passed"

      # Capture job details for audit
      - name: Capture test run details
        if: always()
        run: |
          echo "Integration test completed" > integration-summary.txt
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> integration-summary.txt
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> integration-summary.txt
          echo "Status: ${{ job.status }}" >> integration-summary.txt
      
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-summary
          path: integration-summary.txt
          retention-days: 90
