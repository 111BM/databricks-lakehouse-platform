# ==============================================================================
# Unity Catalog governance — plan and test on PR. Apply is manual.
# ==============================================================================
# Deliberately separate from the bundle deploy workflow, and deliberately NOT on
# a schedule. Permissions change a few times a year; data moves every day. Giving
# them one clock was the design mistake this workflow exists to avoid — see
# docs/UNITY_CATALOG_GRANTS.md ("Why this is Terraform, and not a task in the
# pipeline").
#
# The review artifact is the point: a pull request shows exactly which grants
# would be added and removed, before anyone is affected.
#
# THERE IS NO APPLY JOB, and that is a decision rather than an omission. The
# account groups the model grants to do not exist in this account, so an
# automated apply on merge would fail on an unknown principal every time —
# a permanently red workflow, which is a workflow people stop reading. Grants to
# a missing principal fail at APPLY, not at plan, so the plan below stays green
# and keeps its value in the meantime.
#
# Applying is therefore a human running `terraform apply` in
# governance/terraform, per its README. Restoring an apply job once the groups
# exist is a dozen lines, gated on the existing `production` environment.
#
# TWO THINGS THIS DOES NOT GUARANTEE:
#   - Branch protection is what actually forces a reviewer. That is repository
#     settings, not a file here.
#   - With no remote state configured (versions.tf), each CI run starts stateless,
#     so a plan reports every grant as a create and removals of whole schemas
#     from the model are invisible. Configure the backend before relying on a
#     plan to show access being taken AWAY.
# ==============================================================================

name: Unity Catalog governance

on:
  pull_request:
    paths:
      - "governance/terraform/**"
      - ".github/workflows/governance.yml"

defaults:
  run:
    working-directory: governance/terraform

jobs:
  # --------------------------------------------------------------------------
  # Plan — runs on every PR that touches the model. Never changes anything.
  # --------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Formatting and schema errors should fail here, not in the plan output.
      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # The model tests mock the provider, so they need no workspace and no
      # credentials. They cover what the preconditions structurally cannot:
      # preconditions only catch over-sharing, and a model that grants nobody
      # anything passes all three of them.
      - name: Test the model
        run: terraform test

      # The plan carries the three policy preconditions with it: a model that
      # grants SELECT at catalog level, or SELECT without USE_SCHEMA, or a
      # consumer role on a raw layer, fails at this step.
      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      # Put the diff in the job summary so a reviewer reads permissions changing
      # without opening logs.
      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "## Unity Catalog grant plan"
            echo ""
            echo '```terraform'
            terraform show -no-color tfplan || echo "plan unavailable — see the Plan step"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
