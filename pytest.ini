[pytest]
# Pytest configuration for Superstore Medallion Architecture DAB
# Single source of truth for all test configurations

# Python path - adds both project root and src/ to allow imports
pythonpath = . src

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers - used for filtering tests
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (validate data pipelines end-to-end)
    e2e: End-to-end tests (slowest, full pipeline)
    smoke: Smoke tests (quick validation, run first in CI/CD)
    fast: Fast tests (complete in under 10 seconds)
    slow: Tests that take longer than 30 seconds to run
    bronze: Bronze layer tests (OBT ingestion and entity split)
    silver: Silver layer tests (transformations and DQ routing)
    gold: Gold layer tests (SCD2 dimensions and fact tables)
    metrics: Metrics layer tests

# Output options (NO inline comments allowed)
addopts = -v -p no:cacheprovider --tb=short -ra --strict-markers

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters (suppress noisy deprecation warnings)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
