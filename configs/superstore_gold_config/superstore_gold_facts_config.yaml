# =============================================
# Environment-agnostic Gold layer fact configuration
# =============================================

fact_table_configs:

  # -------------------------------
  # Orders fact table
  # -------------------------------
  orders:
    layer_name: Gold
    table_type: fact
    silver_tbl: orders
    gold_tbl: facts_orders
    metrics_table: gold_layer_metrics
    required_columns:
      - order_id
      - customer_id
      - order_date
      - ship_date
      - ship_mode
    natural_keys:
      - order_id
    hash_column: gold_orders_hash_id
    meta_columns:
      - silver_ingestion_ts
    cluster_by_cols:  # Liquid Clustering keys, at most 4 (superstore_liquid_clustering)
      - customer_id
      - order_date

  # -------------------------------
  # Sales fact table
  # -------------------------------
  sales:
    layer_name: Gold
    table_type: fact
    silver_tbl: sales
    gold_tbl: facts_sales
    metrics_table: gold_layer_metrics
    required_columns:
      - order_id
      - product_id
      - sales
      - quantity
      - discount
      - profit
    natural_keys:
      - order_id
      - product_id
    hash_column: gold_sales_hash_id
    meta_columns:
      - silver_ingestion_ts
    # The MERGE keys. This fact has no customer_id: the old z_order_cols listed it,
    # and nobody noticed because the Z-order helper never ran. Now that the keys
    # are applied, a missing column fails the run by name.
    cluster_by_cols:  # Liquid Clustering keys, at most 4 (superstore_liquid_clustering)
      - order_id
      - product_id

