silver_table_configs:

  # -------------------------------
  # Customers table
  # -------------------------------
  - bronze_table: customers
    quarantine_table: customers_dirty
    silver_table: customers
    audit_table: customers_duplicates
    read_from_table: customers
    business_keys:
      - customer_id
    numeric_cast_cols: {}
    regex_cols: {}
    categorical_allowed_vals:
      region:
        - East
        - West
        - Central
        - South
      segment:
        - Consumer
        - Corporate
        - Home Office
    metrics_table: silver_layer_metrics
    layer_name: silver
    business_columns:
      - customer_id
      - customer_name
      - segment
      - country
      - state
      - city
      - postal_code
      - region
    # Only the business key is fatal. Every other column is descriptive: a
    # customer missing a postal_code used to be quarantined whole, never reached
    # dim_customers, and its orders then contributed nothing to any mart
    # (docs/REFERENTIAL_COMPLETENESS.md). Repairable violations are recorded in
    # repaired_columns and the row continues; Gold substitutes 'Unknown'.
    # Anything omitted here defaults to fatal -- an unclassified column keeps
    # the stricter behaviour rather than being silently downgraded.
    severity:
      customer_id: fatal
      customer_name: repairable
      segment: repairable
      country: repairable
      state: repairable
      city: repairable
      postal_code: repairable
      region: repairable
    meta_columns:
      - bronze_ingestion_ts
    ingestion_col: bronze_ingestion_ts

  # -------------------------------
  # Products table
  # -------------------------------
  - bronze_table: products
    quarantine_table: products_dirty
    silver_table: products
    audit_table: products_duplicates
    read_from_table: products
    business_keys:
      - product_id
    numeric_cast_cols: {}
    regex_cols: {}
    categorical_allowed_vals:
      category:
        - Furniture
        - Office Supplies
        - Technology
    # Source dialect -> canonical vocabulary, applied BEFORE the rules above.
    # The feed emits three-letter category codes alongside full labels; treating
    # the codes as invalid quarantined 50,264 products and orphaned their facts
    # from every mart (docs/REFERENTIAL_COMPLETENESS.md). These are the same
    # fact in a different dialect, not bad data, so they are translated rather
    # than rejected. Exact match only — anything unlisted still faces the rules.
    # Keys MUST stay quoted: YAML 1.1 reads a bare OFF as the boolean false,
    # which turns this mapping into a key that can never match a string column.
    value_standardization:
      category:
        "OFF": Office Supplies
        "TEC": Technology
        "FUR": Furniture
    metrics_table: silver_layer_metrics
    layer_name: silver
    business_columns:
      - product_id
      - product_name
      - category
      - sub_category
    severity:
      product_id: fatal
      product_name: repairable
      category: repairable
      sub_category: repairable
    meta_columns:
      - bronze_ingestion_ts
    ingestion_col: bronze_ingestion_ts


  # -------------------------------
  # Orders table
  # -------------------------------
  - bronze_table: orders
    quarantine_table: orders_dirty
    silver_table: orders
    audit_table: orders_duplicates
    read_from_table: orders
    business_keys:
      - order_id
    numeric_cast_cols: {}
    date_cast_cols:
      - order_date
      - ship_date
    regex_cols:
      # Replace / with [-/] to accept both hyphens and slashes as date separators.
      order_date: |
        (?ix)^(
          ([1-9]|0[1-9]|[12][0-9]|3[01])[-/]([1-9]|0[1-9]|1[0-2])[-/]\d{4} |
          \d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) |
          (0[1-9]|[12][0-9]|3[01])[-/](0[1-9]|1[0-2])[-/]\d{4} |
          \d{1,2}\s(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{4} |
          \d{1,2}\s(?:January|February|March|April|May|June|July|August|September|October|November|December)\s\d{4}
        )$
      ship_date: |
        (?ix)^(
          ([1-9]|0[1-9]|[12][0-9]|3[01])[-/]([1-9]|0[1-9]|1[0-2])[-/]\d{4} |
          \d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) |
          (0[1-9]|[12][0-9]|3[01])[-/](0[1-9]|1[0-2])[-/]\d{4} |
          \d{1,2}\s(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{4} |
          \d{1,2}\s(?:January|February|March|April|May|June|July|August|September|October|November|December)\s\d{4}
        )$

    categorical_allowed_vals: {}
    metrics_table: silver_layer_metrics
    layer_name: silver
    business_columns:
      - order_id
      - customer_id
      - order_date
      - ship_date
      - ship_mode
    meta_columns:
      - bronze_ingestion_ts
    ingestion_col: bronze_ingestion_ts


  # -------------------------------
  # Sales table
  # -------------------------------
  - bronze_table: sales
    quarantine_table: sales_dirty
    silver_table: sales
    audit_table: sales_duplicates
    read_from_table: sales
    business_keys:
      - order_id
      - product_id
    numeric_cast_cols:
      sales: decimal(10,2)
      profit: decimal(10,2)
      discount: decimal(10,2)
      quantity: int
    regex_cols:
      sales: '^\d+(\.\d+)?$'
      profit: '^-?\d+(\.\d+)?$'
      discount: '^\d+(\.\d+)?$'
      quantity: '^\d+$'
    categorical_allowed_vals: {}
    metrics_table: silver_layer_metrics
    layer_name: silver
    business_columns:
      - order_id
      - product_id
      - sales
      - quantity
      - discount
      - profit
    meta_columns:
      - bronze_ingestion_ts
    ingestion_col: bronze_ingestion_ts

