# ==============================================================================
# Unity Catalog governance — check and test on PR, with no credentials.
# ==============================================================================
# Deliberately separate from the bundle deploy workflow, and deliberately NOT on
# a schedule. Permissions change a few times a year; data moves every day. Giving
# them one clock was the design mistake this workflow exists to avoid — see
# docs/UNITY_CATALOG_GRANTS.md ("Why this is Terraform, and not a task in the
# pipeline").
#
# This workflow holds NO Databricks credential. It checks formatting, validates
# the configuration and runs the model tests -- all against a mocked provider,
# so the three policy preconditions are still enforced on every PR (each test
# runs a plan, and a plan evaluates them). `terraform plan` against the real
# workspace is run locally, by a person, under their own OAuth login.
#
# Why no live plan in CI (decided 2026-10-02): reading every principal's grants
# needs owner-or-MANAGE-level rights -- effectively the power to grant access --
# and a lesser identity sees only its own grants, so its plan would be
# misleading. Giving a CI identity that power, to plan a model that cannot be
# applied on Free Edition, was more risk than value; it was also the last thing
# in CI using a personal access token. The mature target is a dedicated
# governance identity (OIDC, no stored secret) that plans on PRs and applies on
# merge. See docs/NON_PROD_IDENTITY.md.
#
# THERE IS NO APPLY JOB, and that is a decision rather than an omission. The
# account groups the model grants to do not exist in this account, so an
# automated apply on merge would fail on an unknown principal every time —
# a permanently red workflow, which is a workflow people stop reading. Grants to
# a missing principal fail at APPLY, not at plan, so the plan below stays green
# and keeps its value in the meantime.
#
# Applying is therefore a human running `terraform apply` in
# governance/terraform, per its README. Restoring an apply job once the groups
# exist is a dozen lines, gated on the existing `production` environment.
#
# THIS DOES NOT GUARANTEE that a reviewer looks: branch protection does that,
# and it is repository settings, not a file here.
# ==============================================================================

name: Unity Catalog governance

on:
  pull_request:
    paths:
      - "governance/terraform/**"
      - ".github/workflows/governance.yml"

defaults:
  run:
    working-directory: governance/terraform

jobs:
  # --------------------------------------------------------------------------
  # Check — runs on every PR that touches the model. No credentials, never
  # contacts Databricks, never changes anything.
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Formatting and schema errors should fail here, not in the plan output.
      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # The model tests mock the provider, so they need no workspace and no
      # credentials. They cover what the preconditions structurally cannot:
      # preconditions only catch over-sharing, and a model that grants nobody
      # anything passes all three of them.
      - name: Test the model
        run: terraform test
