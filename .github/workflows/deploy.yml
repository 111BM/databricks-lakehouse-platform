# ==============================================================================
# Superstore Data Platform CI/CD Pipeline
# ==============================================================================
# Deploy on merge with comprehensive safety gates:
#   - Unit tests (gate: blocks deploy if tests fail)
#   - Bundle validation (gate: catches config errors early)
#   - Manual approval for prod (gate: human review required)
#   - Code coverage tracking (portfolio value: quality metrics)
#
# Branch → Target:  dev → dev, qa → qa, main → prod
# ==============================================================================

name: Superstore Data Platform CI/CD

on:
  push:
    branches: [dev, qa, main]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Unit Tests + Coverage (Gate)
  # Blocks all deploys if tests fail. Coverage shows code quality trends.
  # --------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent hung tests from blocking deploys
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      
      # Cache pip for faster runs
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/unit/requirements-unit.txt') }}
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements-unit.txt
      
      # Run tests with coverage (portfolio value: track code quality)
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v \
            --junitxml=test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30
      
      # Upload coverage (shows team which code is tested)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 90
      
      # Optional: Push to Codecov for visualization
      # - uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage.xml

  # --------------------------------------------------------------------------
  # Job 2: Deploy to Dev/QA (Auto)
  # --------------------------------------------------------------------------
  deploy-non-prod:
    needs: unit-tests
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Set target from branch
        id: target
        run: |
          BRANCH="${GITHUB_REF##*/}"
          case "$BRANCH" in
            dev) TARGET=dev ;;
            qa)  TARGET=qa ;;
            *) echo "Unexpected branch: $BRANCH"; exit 1 ;;
          esac
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Deploying to: $TARGET"
      
      # CRITICAL: Validate before deploy (catches YAML errors, missing vars)
      - name: Validate bundle
        run: databricks bundle validate --target ${{ steps.target.outputs.target }}
      
      - name: Deploy to ${{ steps.target.outputs.target }}
        run: databricks bundle deploy --target ${{ steps.target.outputs.target }}

  # --------------------------------------------------------------------------
  # Job 3: Deploy to Production (Manual Approval Required)
  # --------------------------------------------------------------------------
  deploy-prod:
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # CRITICAL: Manual approval gate for prod
    # Setup: GitHub Settings → Environments → Create "production" → Add reviewers
    environment:
      name: production
      url: https://your-workspace.cloud.databricks.com
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Validate bundle (prod)
        run: databricks bundle validate --target prod
      
      - name: Deploy to production
        run: databricks bundle deploy --target prod
      
      # Audit trail for compliance
      - name: Record production deploy
        if: always()
        run: |
          echo "=== PRODUCTION DEPLOY ===" > prod-deploy-record.txt
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> prod-deploy-record.txt
          echo "Commit: ${{ github.sha }}" >> prod-deploy-record.txt
          echo "Actor: ${{ github.actor }}" >> prod-deploy-record.txt
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> prod-deploy-record.txt
      
      - name: Upload deploy record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-deploy-record
          path: prod-deploy-record.txt
          retention-days: 365
