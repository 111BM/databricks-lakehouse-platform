# ==============================================================================
# Unit Tests - Pull Request Gate
# ==============================================================================
# Fast feedback on PRs. Catches broken logic before merge.
# Local Spark, no Databricks, ~1-2 minutes.
# ==============================================================================

name: Unit Tests

on:
  pull_request:
    branches: [dev, qa, main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # Safety: prevent hung tests
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17 (Spark requirement)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Speed up with cache
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/unit/requirements-unit.txt') }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements-unit.txt

      # Run tests with coverage (shows PR author what's tested)
      - name: Run unit tests
        run: |
          # No -m filter, deliberately. deploy.yml's gate runs this same
          # directory unfiltered, so a marker here would mean the two gates run
          # different sets and a PR could pass a check the merge then fails.
          # The directory already scopes this to unit tests; a marker would only
          # add a way for an unmarked test to be silently skipped.
          pytest tests/unit/ -v \
            --junitxml=test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-${{ github.event.pull_request.number }}
          path: test-results.xml
          retention-days: 30

      # Coverage report (portfolio value for PR reviews)
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          path: coverage.xml
          retention-days: 30
