[project]
name = "superstore_medallionarchitecture_dab"
version = "0.0.1"
authors = [{ name = "bireshmoktan@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 125

[tool.hatch.build.targets.wheel]
# Source lives under src/; hatchling maps each src/<pkg> to <pkg> in the wheel.
packages = [
    "src/superstore_shared_utilities",
    "src/superstore_bronze",
    "src/superstore_silver",
    "src/superstore_gold"
]
# Databricks notebooks (.ipynb) are run as job tasks from the synced bundle,
# not imported from the wheel — keep them out of the package.
exclude = ["**/*.ipynb"]
