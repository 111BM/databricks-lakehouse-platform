resources:
  jobs:
    superstore_data_platform:
      name: superstore_data_platform_${bundle.target}
      description: Superstore_lakehouse_medallion_architecture

      email_notifications:
        on_start:
          - bireshmoktan@gmail.com
        on_success:
          - bireshmoktan@gmail.com
        on_failure:
          - bireshmoktan@gmail.com
      schedule:
        quartz_cron_expression: 1 0 10 * * ?
        timezone_id: Australia/Sydney
        pause_status: UNPAUSED
      tasks:
        - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/superstore_shared_utilities/superstore_pipeline_master_run_id_init
            source: WORKSPACE
            base_parameters:
              SUPERSTORE_ENV: ${var.SUPERSTORE_ENV}
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
          environment_key: superstore_bronze_layer_environment
        - task_key: superstore_bronze_layer
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/superstore_orchestrator/layer_orchestrator/superstore_bronze_layer_ETL_orchestrator
            base_parameters:
              SUPERSTORE_ENV: ${var.SUPERSTORE_ENV}
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
              n_id}}"
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: superstore_silver_layer
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_bronze_layer
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/superstore_orchestrator/layer_orchestrator/superstore_silver_layer_ETL_orchestrator
            base_parameters:
              SUPERSTORE_ENV: ${var.SUPERSTORE_ENV}
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: superstore_gold_layer_dimensions
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_silver_layer
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/superstore_orchestrator/layer_orchestrator/superstore_gold_dimensional_orchestrator
            base_parameters:
              SUPERSTORE_ENV: ${var.SUPERSTORE_ENV}
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: superstore_gold_layer_facts
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_silver_layer
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/superstore_orchestrator/layer_orchestrator/superstore_gold_facts_orchestrator
            base_parameters:
              SUPERSTORE_ENV: ${var.SUPERSTORE_ENV}
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: features_customer
          depends_on:
            - task_key: superstore_gold_layer_facts
            - task_key: superstore_gold_layer_dimensions
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/features/features_customer
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: features_customer_product
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/features/features_customer_product
            source: WORKSPACE
        - task_key: features_product
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/features/features_product
            source: WORKSPACE
        - task_key: features_sales_timeseries
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/features/features_sales_timeseries
            source: WORKSPACE
        - task_key: mart_customer_360
          depends_on:
            - task_key: superstore_gold_layer_facts
            - task_key: superstore_gold_layer_dimensions
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/marts/mart_customer_360
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: mart_production_performance
          depends_on:
            - task_key: superstore_gold_layer_dimensions
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/marts/mart_production_performance
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: mart_sales_daily
          depends_on:
            - task_key: superstore_gold_layer_dimensions
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/marts/mart_sales_daily
            source: WORKSPACE
          environment_key: superstore_bronze_layer_environment
        - task_key: metrics_business_kpi_view
          depends_on:
            - task_key: mart_sales_daily
            - task_key: mart_customer_360
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/metrics/metrics_business_kpi
            source: WORKSPACE
        - task_key: metrics_daily_kpi_view
          depends_on:
            - task_key: mart_sales_daily
          notebook_task:
            notebook_path: /Workspace/Users/bireshmoktan@gmail.com/superstore_medallionarchitecture_dab/src/metrics/metrics_daily_kpi
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: superstore_bronze_layer_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
