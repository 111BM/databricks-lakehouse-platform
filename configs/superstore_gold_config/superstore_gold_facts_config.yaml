# =============================================
# Environment-agnostic Gold layer fact configuration
# =============================================

fact_table_configs:

  # -------------------------------
  # Orders fact table
  # -------------------------------
  orders:
    layer_name: Gold
    table_type: fact
    silver_tbl: orders
    gold_tbl: facts_orders
    metrics_table: gold_layer_metrics
    required_columns:
      - order_id
      - customer_id
      - order_date
      - ship_date
      - ship_mode
      - ingestion_ts
      - source_file_path
      - source_file_name
      - silver_orders_hash_id
    natural_keys:
      - order_id
    hash_column: silver_orders_hash_id
    z_order_cols:
      - customer_id
      - order_date

  # -------------------------------
  # Sales fact table
  # -------------------------------
  sales:
    layer_name: Gold
    table_type: fact
    silver_tbl: sales
    gold_tbl: facts_sales
    metrics_table: gold_layer_metrics
    required_columns:
      - order_id
      - customer_id
      - product_id
      - sales
      - quantity
      - discount
      - profit
      - ingestion_ts
      - source_file_path
      - source_file_name
      - silver_sales_hash_id
    natural_keys:
      - order_id
      - product_id
    hash_column: silver_sales_hash_id
    z_order_cols:
      - customer_id
      - product_id

