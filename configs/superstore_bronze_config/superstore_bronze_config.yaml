# -------------------------------
# # Column renames for Bronze ingestion
# # -------------------------------
column_rename_map:
  "Row ID": "row_id"
  "Customer Name": "customer_name"
  "Segment": "segment"
  "Country": "country"
  "City": "city"
  "State": "state"
  "Postal Code": "postal_code"
  "Region": "region"
  "Product ID": "product_id"
  "Category": "category"
  "Sub-Category": "sub_category"
  "Product Name": "product_name"
  "Customer ID": "customer_id"
  "Order ID": "order_id"
  "Order Date": "order_date"
  "Ship Date": "ship_date"
  "Ship Mode": "ship_mode"
  "Sales": "sales"
  "Quantity": "quantity"
  "Discount": "discount"
  "Profit": "profit"

# -------------------------------
# Bronze main table configuration
# -------------------------------
bronze_main:
  table_name: "superstore_raw"  # just entity/table name, no catalog/schema
  # Liquid Clustering keys (at most 4), applied by superstore_liquid_clustering.
  # The entity split reads this table as `bronze_ingestion_ts > last processed`,
  # so that is the key that lets it skip files. Replaces PARTITIONED BY (ingestion_date).
  cluster_by_columns: ["bronze_ingestion_ts"]
  metrics_table: "bronze_layer_main_ingestion_metrics"
  layer_name: "Bronze"
  metadata_columns:
    - bronze_ingestion_ts
    - ingestion_date
    - source_file_path
    - source_file_name
    - source_file_size_bytes
    - source_file_modification_time
    

# -------------------------------
# -------------------------------
# Source columns deliberately NOT carried into any entity table.
# -------------------------------
# A source column is in exactly one of three states, and this list is the third:
#
#   declared in an entity's `columns`  -> carried downstream
#   listed here                        -> knowingly dropped, decision recorded
#   neither                            -> SCHEMA DRIFT, nobody has decided
#
# Without this list the drift detector reports every deliberate omission on
# every run, and a monitor that is permanently red is one people stop reading.
#
# Adding a column here is a decision, not a silencing: state why.
ignored_source_columns:
  # Row number of the CSV, assigned by whoever exported the file. It identifies
  # a position in a delivery, not a business entity, and it is not stable across
  # re-exports -- so carrying it downstream would invite joins that break the
  # next time the vendor re-sorts the file.
  - row_id

# -------------------------------
# Bronze entities
# -------------------------------
# cluster_by_columns: Liquid Clustering keys (at most 4), applied by
# superstore_liquid_clustering. bronze_ingestion_ts first because Silver reads
# each entity by an ingestion-time window; the business key second because that
# is what lookups and deduplication filter on. Replaces PARTITIONED BY
# (bronze_ingestion_ts), which made a new partition of small files every run.
bronze_entities:
  customers:
    table_name: "customers"
    metrics_table: "bronze_layer_entity_metrics"
    source_table: "superstore_raw"
    checkpointLocation: "/Volumes/workspace/default/my_filestore/superstore_metadata/superstore_bronze_metadata/entity_checkpoint/customers/"
    layer_name: "Bronze"
    columns: ["customer_id", "customer_name", "segment", "country", "state", "city", "postal_code", "region"]
    business_key: "customer_id"
    cluster_by_columns: ["bronze_ingestion_ts", "customer_id"]
    metadata_columns:
      - bronze_ingestion_ts
      - ingestion_date
      - source_file_path
      - source_file_name
      - source_file_size_bytes
      - source_file_modification_time
      

  products:
    table_name: "products"
    metrics_table: "bronze_layer_entity_metrics"
    source_table: "superstore_raw"
    checkpointLocation: "/Volumes/workspace/default/my_filestore/superstore_metadata/superstore_bronze_metadata/entity_checkpoint/products/"
    layer_name: "Bronze"
    columns: ["product_id", "product_name", "category", "sub_category"]
    business_key: "product_id"
    cluster_by_columns: ["bronze_ingestion_ts", "product_id"]
    metadata_columns:
      - bronze_ingestion_ts
      - ingestion_date
      - source_file_path
      - source_file_name
      - source_file_size_bytes
      - source_file_modification_time
      

  orders:
    table_name: "orders"
    metrics_table: "bronze_layer_entity_metrics"
    source_table: "superstore_raw"
    checkpointLocation: "/Volumes/workspace/default/my_filestore/superstore_metadata/superstore_bronze_metadata/entity_checkpoint/orders/"
    layer_name: "Bronze"
    columns: ["order_id", "customer_id", "order_date", "ship_date", "ship_mode"]
    business_key: "order_id"
    cluster_by_columns: ["bronze_ingestion_ts", "order_id"]
    metadata_columns:
      - bronze_ingestion_ts
      - ingestion_date
      - source_file_path
      - source_file_name
      - source_file_size_bytes
      - source_file_modification_time
      
  sales:
    table_name: "sales"
    metrics_table: "bronze_layer_entity_metrics"
    source_table: "superstore_raw"
    checkpointLocation: "/Volumes/workspace/default/my_filestore/superstore_metadata/superstore_bronze_metadata/entity_checkpoint/sales/"
    layer_name: "Bronze"
    columns: ["order_id", "product_id", "sales", "quantity", "discount", "profit"]
    business_key: ["order_id", "product_id"]
    cluster_by_columns: ["bronze_ingestion_ts", "order_id", "product_id"]
    metadata_columns:
      - bronze_ingestion_ts
      - ingestion_date
      - source_file_path
      - source_file_name
      - source_file_size_bytes
      - source_file_modification_time
      

# -----------------------------
# File Paths & Table Names (Configuration per Environment)
# -----------------------------
# source_listing_url points at a GitHub "contents" API folder listing. The
# acquisition task lists it, compares against what is already in the landing
# volume, and downloads only new files - so adding a dated file to the repo needs
# no config change. integration_test deliberately has NO source_listing_url: the
# seed owns that volume and a download would overwrite its controlled dataset.
env_paths:
  dev:
    raw_source_file_path: "/Volumes/workspace/default/my_filestore_dev/raw/"
    schema_location: "/Volumes/workspace/default/my_filestore_dev/superstore_metadata/superstore_bronze_metadata/schema/"
    checkpoint_location: "/Volumes/workspace/default/my_filestore_dev/superstore_metadata/superstore_bronze_metadata/checkpoint/"
    source_listing_url: "https://api.github.com/repos/111BM/Datasets/contents/superstore_data_platform/dev"

  qa:
    raw_source_file_path: "/Volumes/workspace/default/my_filestore_qa/raw/"
    schema_location: "/Volumes/workspace/default/my_filestore_qa/superstore_metadata/superstore_bronze_metadata/schema/"
    checkpoint_location: "/Volumes/workspace/default/my_filestore_qa/superstore_metadata/superstore_bronze_metadata/checkpoint/"
    source_listing_url: "https://api.github.com/repos/111BM/Datasets/contents/superstore_data_platform/qa"

  prod:
    raw_source_file_path: "/Volumes/workspace/default/my_filestore_prod/raw/"
    schema_location: "/Volumes/workspace/default/my_filestore_prod/superstore_metadata/superstore_bronze_metadata/schema/"
    checkpoint_location: "/Volumes/workspace/default/my_filestore_prod/superstore_metadata/superstore_bronze_metadata/checkpoint/"
    source_listing_url: "https://api.github.com/repos/111BM/Datasets/contents/superstore_data_platform/prod"

  # Isolated environment used ONLY by the automated integration test job.
  # Must match where 01_seed_integration_data writes the seed CSV.
  integration_test:
    raw_source_file_path: "/Volumes/workspace/default/my_filestore_integration_test/raw/"
    schema_location: "/Volumes/workspace/default/my_filestore_integration_test/superstore_metadata/superstore_bronze_metadata/schema/"
    checkpoint_location: "/Volumes/workspace/default/my_filestore_integration_test/superstore_metadata/superstore_bronze_metadata/checkpoint/"

