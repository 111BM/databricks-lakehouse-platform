# ==============================================================================
# Superstore Data Platform CI/CD Pipeline
# ==============================================================================
# Deploy on merge with comprehensive safety gates:
#   - Unit tests (gate: blocks deploy if tests fail)
#   - Bundle validation (gate: catches config errors early)
#   - Prod deploys only when started by hand (workflow_dispatch) -- a
#     deliberate action, not a reviewed approval (see deploy-prod)
#   - Code coverage tracking (portfolio value: quality metrics)
#
# Branch → Target:  dev → dev, qa → qa, main → prod
#
# Toolchain is pinned in every workflow, never floating:
#   - runs-on: ubuntu-24.04, not ubuntu-latest, which moves to Ubuntu 26 on
#     2026-10-19 and would change Java/Python under the unit tests unannounced.
#   - databricks/setup-cli@v1.19.0, not @main. @main installed whatever CLI was
#     newest on each run -- which is how CI silently moved to a CLI that wrote
#     prod bundle state the local CLI could no longer read -- and ran unreviewed
#     code in the job holding prod credentials. Keep the local CLI on the same
#     version. Upgrade either deliberately, in one commit, after a dev/qa run.
# ==============================================================================

name: Superstore Data Platform CI/CD

on:
  push:
    branches: [dev, qa, main]
  # Adds the "Run workflow" button in the Actions tab. It is the only way prod
  # deploys: a push to main runs the unit tests and stops there.
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Unit Tests + Coverage (Gate)
  # Blocks all deploys if tests fail. Coverage shows code quality trends.
  # --------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # Prevent hung tests from blocking deploys
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      
      # Cache pip for faster runs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/unit/requirements-unit.txt') }}
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements-unit.txt
      
      # Run tests with coverage (portfolio value: track code quality)
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v \
            --junitxml=test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30
      
      # Upload coverage (shows team which code is tested)
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 90
      
      # Optional: Push to Codecov for visualization
      # - uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage.xml

  # --------------------------------------------------------------------------
  # Job 2a: Deploy to Dev (Auto, on push to dev)
  # --------------------------------------------------------------------------
  deploy-dev:
    needs: unit-tests
    if: github.ref == 'refs/heads/dev'
    # One deploy to dev at a time: a second waits in GitHub instead of
    # failing on the bundle's deployment lock. See docs/CI_CONCURRENCY.md.
    concurrency:
      group: dev-environment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0

      # Provide a pinned Terraform so `bundle deploy` uses it instead of doing its
      # own signed download, which can fail with "openpgp: key expired". 1.5.5 is
      # the version the Databricks CLI expects, so there's no version mismatch.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.5"
          terraform_wrapper: false

      - name: Point Databricks CLI at Terraform
        run: |
          echo "DATABRICKS_TF_EXEC_PATH=$(which terraform)" >> "$GITHUB_ENV"
          echo "DATABRICKS_TF_VERSION=1.5.5" >> "$GITHUB_ENV"

      # CRITICAL: Validate before deploy (catches YAML errors, missing vars)
      - name: Validate bundle (dev)
        run: databricks bundle validate --target dev

      - name: Deploy to dev
        run: databricks bundle deploy --target dev

  # --------------------------------------------------------------------------
  # Job 2b: Deploy to QA (Auto, on push to qa)
  # --------------------------------------------------------------------------
  deploy-qa:
    needs: unit-tests
    if: github.ref == 'refs/heads/qa'
    # SHARED with the integration test (integration-tests.yml): only one thing
    # touches qa at a time, so a deploy can never replace qa's code while a
    # test is running against it. The name must match there exactly -- a typo
    # silently creates a second, independent group. See docs/CI_CONCURRENCY.md.
    concurrency:
      group: qa-environment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0

      # Provide a pinned Terraform so `bundle deploy` uses it instead of doing its
      # own signed download, which can fail with "openpgp: key expired". 1.5.5 is
      # the version the Databricks CLI expects, so there's no version mismatch.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.5"
          terraform_wrapper: false

      - name: Point Databricks CLI at Terraform
        run: |
          echo "DATABRICKS_TF_EXEC_PATH=$(which terraform)" >> "$GITHUB_ENV"
          echo "DATABRICKS_TF_VERSION=1.5.5" >> "$GITHUB_ENV"

      # CRITICAL: Validate before deploy (catches YAML errors, missing vars)
      - name: Validate bundle (qa)
        run: databricks bundle validate --target qa

      - name: Deploy to qa
        run: databricks bundle deploy --target qa

  # --------------------------------------------------------------------------
  # Job 3: Deploy to Production (started by hand only)
  # --------------------------------------------------------------------------
  deploy-prod:
    needs: unit-tests
    # Only when started by hand from main: Actions -> this workflow -> Run
    # workflow -> main. A push to main no longer deploys prod.
    #
    # This replaces an approval gate that never worked. The job used to declare
    # `environment: production` with a comment promising manual approval, but a
    # GitHub environment blocks only when required reviewers are configured, and
    # on a private repository that needs GitHub Enterprise -- so every push to
    # main deployed prod unattended (measured: 80-120 s in 2026-08, 106 s on
    # 2026-10-01). A manual trigger makes each deploy a deliberate act and
    # records who started it. It is NOT a review: whoever can start the
    # workflow can deploy, with no second person, and editing this condition
    # removes it. See README -> Platform constraints.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Two manual runs started close together deploy one after the other, never
    # at once. See docs/CI_CONCURRENCY.md.
    concurrency:
      group: prod-environment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Kept for the deployment history it records (Code -> Deployments: who,
    # when, which commit), not for protection -- see above. The URL is the prod
    # job, shown as "View deployment" on each deploy.
    environment:
      name: production
      url: https://dbc-081a6a55-88cd.cloud.databricks.com/jobs/127108400184634

    # Prod deploys as the superstore-ci-prod service principal (OAuth M2M),
    # not a personal access token: a person's token carries all of that
    # person's rights (here, workspace admin) and stops working when they
    # leave or it expires. The service principal holds only what the pipeline
    # needs -- see governance/manual_grants/. dev and qa still deploy with the PAT:
    # their bundle roots live under a user's home folder (`~/`), so switching
    # identity there would duplicate their jobs rather than update them.
    #
    # DATABRICKS_TOKEN must NOT also be set here: with two auth methods in the
    # environment the CLI refuses to pick one and fails.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0

      # Proves in the log WHICH identity deployed -- a misconfigured secret
      # would otherwise surface only as a confusing permission error later.
      # Prints the application ID (an identifier), never the secret.
      - name: Show deploying identity
        run: |
          databricks current-user me -o json | jq -r '"Deploying as: \(.userName) (\(.displayName))"'

      # Provide a pinned Terraform so `bundle deploy` uses it instead of doing its
      # own signed download, which can fail with "openpgp: key expired". 1.5.5 is
      # the version the Databricks CLI expects, so there's no version mismatch.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.5"
          terraform_wrapper: false

      - name: Point Databricks CLI at Terraform
        run: |
          echo "DATABRICKS_TF_EXEC_PATH=$(which terraform)" >> "$GITHUB_ENV"
          echo "DATABRICKS_TF_VERSION=1.5.5" >> "$GITHUB_ENV"
      
      - name: Validate bundle (prod)
        run: databricks bundle validate --target prod
      
      - name: Deploy to production
        run: databricks bundle deploy --target prod
      
      # Audit trail for compliance
      - name: Record production deploy
        if: always()
        run: |
          echo "=== PRODUCTION DEPLOY ===" > prod-deploy-record.txt
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> prod-deploy-record.txt
          echo "Commit: ${{ github.sha }}" >> prod-deploy-record.txt
          echo "Actor: ${{ github.actor }}" >> prod-deploy-record.txt
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> prod-deploy-record.txt
      
      - name: Upload deploy record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-deploy-record
          path: prod-deploy-record.txt
          retention-days: 90  # repository maximum; it asked for 365 and GitHub silently used 90
