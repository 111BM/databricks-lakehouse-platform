resources:
  jobs:
    superstore_data_platform:
      name: superstore_data_platform_${bundle.target}
      description: |
        Superstore Lakehouse ETL Pipeline - Medallion Architecture (Bronze → Silver → Gold)
        
        PARAMETERS:

        run_mode (string):
          • incremental  - Process only new data since last run (DEFAULT for scheduled runs)
          • backfill     - Load data never loaded. Re-acquires from source, so Bronze runs.
                           Requires start_date; end_date defaults to today.
          • replay       - Re-derive Silver and Gold from the Bronze already held, because
                           the logic changed. Bronze is SKIPPED - the source is never
                           contacted. Requires start_date.
          • full_refresh - Replay with no window. DISABLED by default: enabling it takes a
                           code change (allow_full_refresh), not a parameter.

          Anything else raises. An unrecognised mode used to fall back to incremental,
          which meant a typo ran a normal load while reporting success.

        start_date (YYYY-MM-DD):
          • Required for backfill and replay
          • Example: 2026-05-08
          • Leave empty for incremental/full_refresh

        end_date (YYYY-MM-DD):
          • Optional for backfill and replay; defaults to today
          • Example: 2026-05-10
          • Leave empty for incremental/full_refresh

        dry_run (true | false):
          • true  - Report impact and exit before writing, in EVERY task that writes
          • false - Execute and write data (DEFAULT)

          dry_run is a modifier, not a mode: it combines with any of the four above.

        NOTE: the window filters INGESTION date, not business date. "backfill May"
        means "reprocess what arrived in May", not "orders placed in May".

        USAGE EXAMPLES:

        Normal Run:
          run_mode: incremental
          dry_run: false

        Preview a replay before running it:
          run_mode: replay
          start_date: 2026-05-08
          end_date: 2026-05-08
          dry_run: true

        Replay 1 Day (after a logic fix):
          run_mode: replay
          start_date: 2026-05-08
          end_date: 2026-05-08
          dry_run: false

        Backfill a window the source never delivered:
          run_mode: backfill
          start_date: 2026-05-01
          end_date: 2026-05-07
          dry_run: false

      # Job-level parameters (visible in UI).
      #
      # Each name MUST MATCH the widget key the notebook reads (underscores here,
      # e.g. dbutils.widgets.get("run_mode")). Databricks pushes a job parameter
      # straight into a task widget that shares its key, so no base_parameters entry
      # is needed. A hyphenated name does NOT resolve via {{job.parameters.x-y}} in
      # base_parameters - it arrives literal, which silently disabled dry_run and
      # the run mode until this was fixed.
      parameters:
        - name: run_mode
          default: ${var.run_mode}
        - name: start_date
          default: ${var.start_date}
        - name: end_date
          default: ${var.end_date}
        - name: dry_run
          default: ${var.dry_run}
        # Overridable environment. Defaults to the target's env (dev/qa/prod) so
        # normal runs are unchanged; the integration test job overrides this to
        # "integration_test" to route the whole pipeline to isolated schemas + volume.
        #
        # NOTE: the key is SUPERSTORE_ENV (underscore) to MATCH the notebook widget
        # of the same name. Databricks pushes a job parameter straight into a task
        # widget that shares its key (job parameter wins), so the value reaches the
        # notebook directly. A hyphenated name (superstore-env) does NOT resolve via
        # {{job.parameters.superstore-env}} in base_parameters - it arrives literal.
        - name: SUPERSTORE_ENV
          default: ${var.SUPERSTORE_ENV}

      tasks:
        - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: ${workspace.file_path}/src/superstore_shared_utilities/superstore_pipeline_master_run_id_init
            source: WORKSPACE
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
          environment_key: superstore_serverless_environment
        - task_key: superstore_catalog_and_schemas_init
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: ${workspace.file_path}/src/superstore_shared_utilities/superstore_catalog_and_schemas_init
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        # Acquire source files from the external HTTP feed into the landing volume
        # before Auto Loader runs. Skips itself in integration_test (seed owns that data).
        - task_key: bronze_source_acquisition
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: ${workspace.file_path}/src/superstore_bronze/bronze_source_acquisition
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: superstore_bronze_layer
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_catalog_and_schemas_init
            - task_key: bronze_source_acquisition
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_bronze_layer_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: superstore_silver_layer
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_bronze_layer
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_silver_layer_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: superstore_gold_layer_dimensions
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_silver_layer
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_dimensional_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: superstore_gold_layer_facts
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
            - task_key: superstore_silver_layer
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_facts_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "{{job.parameters.SUPERSTORE_ENV}}"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_ru\
                n_id}}"
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: features_customer
          depends_on:
            - task_key: superstore_gold_layer_facts
            - task_key: superstore_gold_layer_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/src/features/features_customer
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: features_customer_product
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/src/features/features_customer_product
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: features_product
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/src/features/features_product
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: features_sales_timeseries
          depends_on:
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/src/features/features_sales_timeseries
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: mart_customer_360
          depends_on:
            - task_key: superstore_gold_layer_facts
            - task_key: superstore_gold_layer_dimensions
          notebook_task:
            notebook_path: ${workspace.file_path}/src/marts/mart_customer_360
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: customer_kpi_view
          depends_on:
            - task_key: mart_customer_360
          notebook_task:
            notebook_path: ${workspace.file_path}/src/metrics/customer_kpi
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: mart_production_performance
          depends_on:
            - task_key: superstore_gold_layer_dimensions
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/src/marts/mart_production_performance
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: product_insights_kpi_view
          depends_on:
            - task_key: mart_production_performance
          notebook_task:
            notebook_path: ${workspace.file_path}/src/metrics/product_insights_kpi
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: mart_sales_daily
          depends_on:
            - task_key: superstore_gold_layer_dimensions
            - task_key: superstore_gold_layer_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/src/marts/mart_sales_daily
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: metrics_business_kpi_view
          depends_on:
            - task_key: mart_sales_daily
            - task_key: mart_customer_360
          notebook_task:
            notebook_path: ${workspace.file_path}/src/metrics/metrics_business_kpi
            source: WORKSPACE
          environment_key: superstore_serverless_environment
        - task_key: metrics_daily_kpi_view
          depends_on:
            - task_key: mart_sales_daily
          notebook_task:
            notebook_path: ${workspace.file_path}/src/metrics/metrics_daily_kpi
            source: WORKSPACE
          environment_key: superstore_serverless_environment
      queue:
        enabled: true
      environments:
        - environment_key: superstore_serverless_environment
          spec:
            environment_version: "5"

      # Weekly, Saturdays 19:00 Sydney. Quartz format is
      # `sec min hour day-of-month month day-of-week`; the `?` is required
      # because Quartz forbids specifying both day fields.
      #
      # This resource is shared by all three targets. dev and qa are
      # `mode: development` in databricks.yml, and Databricks Asset Bundles
      # PAUSE schedules automatically in development mode, so only prod runs it.
      #
      # pause_status is deliberately NOT set here. An explicit value OVERRIDES
      # that preset -- setting UNPAUSED scheduled the dev job to run weekly,
      # verified by reading the deployed job back from the API. The safety comes
      # from a preset that is invisible in this file, and stating it explicitly
      # is exactly what breaks it.
      #
      # Weekly rather than daily on purpose. The source is a static dataset, so
      # a run mostly pays 18 serverless task startups to ingest nothing; weekly
      # exercises the pipeline and its monitors without pretending to serve an
      # SLA nobody has asked for.
      #
      # Only safe because of the exception-handling fix: before it, an
      # unattended run could fail all four Silver entities, send no email, and
      # report SUCCESS with stale Gold downstream.
      schedule:
        quartz_cron_expression: "0 0 19 ? * SAT"
        timezone_id: Australia/Sydney

      email_notifications:
        on_failure:
          - bireshmoktan@gmail.com
        no_alert_for_skipped_runs: true

      performance_target: PERFORMANCE_OPTIMIZED
