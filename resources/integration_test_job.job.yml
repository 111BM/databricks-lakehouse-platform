resources:
  jobs:
    superstore_integration_test:
      name: superstore_integration_test_${bundle.target}
      description: |
        Integration test. Seeds deliberately-dirty data into an isolated volume,
        runs the REAL pipeline against isolated integration_test_* schemas
        (SUPERSTORE_ENV=integration_test), then asserts correctness per layer:
        bronze / silver / gold each run as their own task so failures point to
        the exact layer.

        The environment is reset BEFORE seeding, and cleaned up only on a
        fully green run. A failed run therefore leaves its integration_test_*
        schemas intact for a post-mortem, and the next run's reset guarantees
        the clean start regardless.

        Run:   databricks bundle run superstore_integration_test --target qa
        A failed assertion fails its task -> fails the job (non-zero exit) so CI
        can block the merge.

        Notebook paths are bundle-relative (${workspace.file_path}) so the job
        reads the code the bundle deployed for the target. Assert notebooks get
        a helpers_path parameter pointing at the deployed _helpers folder.

      tasks:
        # 0. Reset the isolated environment BEFORE seeding.
        #
        # This is now the ONLY place isolation is enforced -- there is no
        # end-of-run cleanup. See task 7 below for why.
        #
        # Isolation used to be guaranteed by cleaning up at the END, which also
        # destroyed the evidence of whatever had just happened. Enforcing it at
        # the START gives exactly the same property -- every run begins from
        # nothing -- while leaving the previous run's tables available to query.
        #
        # It reuses 04_cleanup_integration rather than duplicating its schema
        # list. That list was wrong once already: it omitted features and
        # semantic_layer, and those schemas survived every run unnoticed until
        # 98337a2.
        - task_key: reset_environment
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/04_cleanup_integration
            source: WORKSPACE
          environment_key: integration_test_environment

        # 1. Seed dirty data into the isolated raw volume
        - task_key: seed_initial_data 
          depends_on:
            - task_key: reset_environment
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/01_seed_integration_data
            source: WORKSPACE
          environment_key: integration_test_environment

        # 2. Run the REAL pipeline, routed to integration_test_* schemas
        - task_key: run_pipeline_initial_load
          depends_on:
            - task_key: seed_initial_data 
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "incremental"
              start_date: ""
              end_date: ""
              dry_run: "false"

        # 3. Per-layer assertions (fan out from a single pipeline run)
        - task_key: assert_bronze
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/bronze/assert_bronze
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_silver
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/silver/assert_silver
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_gold_dim
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_dim
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_gold_fact
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_fact
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        # 4. Second incremental load: seed a changed + an unchanged customer
        - task_key: seed_changed_data
          depends_on:
            - task_key: assert_bronze
            - task_key: assert_silver
            - task_key: assert_gold_dim
            - task_key: assert_gold_fact
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/02_seed_scd2_change
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: run_pipeline_incremental_load
          depends_on:
            - task_key: seed_changed_data
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "incremental"
              start_date: ""
              end_date: ""
              dry_run: "false"

        # 5. Assert SCD2 change detection + idempotency
        - task_key: assert_scd2_change
          depends_on:
            - task_key: run_pipeline_incremental_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_scd2_change
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              # Production module, not a test helper: the four-term reconciliation
              # check runs HERE because this is the only point in the suite where
              # the state is still incremental and the shortfall exists.
              shared_utils_path: ${workspace.file_path}/src/superstore_shared_utilities
          environment_key: integration_test_environment

        # 5b. Schema drift. Runs after the SECOND load because that is the load
        #     carrying a column the first seed did not send — `Discount Reason`.
        #
        #     The detector reports SCHEMA_STABLE in every environment, since the
        #     source is a static CSV and no column has ever appeared. A detector
        #     that has only ever said "nothing to report" is indistinguishable
        #     from one that CANNOT report, and this platform has already shipped
        #     that twice: the freshness alert evaluated daily while unable to
        #     breach its own threshold, and the orphaned-fact counters went blind
        #     the moment severity tiers made their condition impossible.
        #
        #     This is the only place the event can be manufactured, so it is the
        #     only thing that makes the feature falsifiable.
        - task_key: assert_schema_drift
          depends_on:
            - task_key: run_pipeline_incremental_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/assert_schema_drift
            source: WORKSPACE
            base_parameters:
              # REQUIRED. Table names come from assertion_helpers (ENV is hardcoded
              # to integration_test there), not from superstore_platform_config --
              # whose get_env() reads SUPERSTORE_ENV and DEFAULTS TO DEV. Without
              # this widget the notebook asserted against dev for several runs
              # while reporting confidently about "the suite".
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        # 6. Replay leg. The suite ran `incremental` only, so every windowed-mode
        #    defect was invisible to it — an append-only quarantine that doubled
        #    on every replay, and a Gold dimension window on the wrong clock that
        #    selected zero rows and reported success. Both were green in CI.
        #
        #    The window is derived from the ingested data and passed as a task
        #    value, not hard-coded: the seed lands "now", so a fixed or
        #    job-start date would quietly miss if a run crossed midnight UTC.
        #    Two replays, not one. Idempotency is a replay-vs-replay property:
        #    a replay processes the window as ONE batch where the incremental
        #    loads used several, so it legitimately reclassifies rows between
        #    Silver and audit (the sum is preserved, the partition is not).
        #    Comparing a replay against the incremental state fails on correct
        #    behaviour — the first version of this leg did exactly that.
        - task_key: snapshot_before_replay
          depends_on:
            - task_key: assert_scd2_change
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/03_snapshot_before_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              phase: "incremental"
          environment_key: integration_test_environment

        # ------------------------------------------------------------------
        # Replay legs: the three layers replay touches, not the whole DAG.
        # ------------------------------------------------------------------
        # Previously each replay was a run_job_task invoking the full 18-task
        # pipeline. Measured on a green suite: 4 pipeline invocations, 88 task
        # startups, 41.9 of 56.2 minutes -- to process a NINE ROW seed. Almost
        # none of that is computation; it is serverless task startup, which the
        # performance section already measures at ~60% of runtime on real data
        # and which approaches 100% at this size.
        #
        # A replay re-derives Silver and Gold from Bronze already held. Bronze
        # exits immediately (reads_from_source is false for replay), and
        # assert_replay inspects BRONZE, SILVER, GOLD, QUARANTINE, AUDIT and
        # METRICS -- never marts, features or KPI views. Those eleven tasks ran
        # on every replay and nothing asserted on them.
        #
        # WHAT THIS GIVES UP, stated plainly: these legs are a hand-maintained
        # subset of the pipeline's internal wiring rather than the pipeline
        # itself. Add a layer that replay should cover and this will not run it.
        # The initial and incremental loads above are deliberately left as full
        # run_job_task invocations for exactly that reason -- they are what
        # proves the real invocation path works. The replays re-run the same
        # code on the same data with a different run_mode; fidelity is already
        # established by the time they start.
        #
        # The drift guard is assert_replay itself: it requires a REPLAY
        # load_type row in BOTH silver_layer_metrics and gold_layer_metrics, so
        # dropping a layer from these legs fails the suite rather than quietly
        # narrowing what is tested.
        #
        # Both legs share one master_run_id, because the layer orchestrators
        # read task values from a HARDCODED taskKey
        # (superstore_pipeline_master_run_id_init) and a job may only contain
        # one task with that key. In production each replay would be a separate
        # job run with its own id. The assertions are count-based on table
        # contents, so this does not affect them -- recorded because it is a
        # real divergence from production, not because it bites.
        - task_key: superstore_pipeline_master_run_id_init
          depends_on:
            - task_key: snapshot_before_replay
          notebook_task:
            notebook_path: ${workspace.file_path}/src/superstore_shared_utilities/superstore_pipeline_master_run_id_init
            source: WORKSPACE
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
          environment_key: integration_test_environment

        - task_key: replay_1_silver
          depends_on:
            - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_silver_layer_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: replay_1_gold_dims
          depends_on:
            - task_key: replay_1_silver
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_dimensional_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: replay_1_gold_facts
          depends_on:
            - task_key: replay_1_silver
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_facts_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment


        - task_key: snapshot_after_replay_1
          depends_on:
            - task_key: replay_1_gold_dims
            - task_key: replay_1_gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/03_snapshot_before_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              phase: "replay_1"
          environment_key: integration_test_environment

        - task_key: replay_2_silver
          depends_on:
            - task_key: snapshot_after_replay_1
            - task_key: superstore_pipeline_master_run_id_init
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_silver_layer_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: replay_2_gold_dims
          depends_on:
            - task_key: replay_2_silver
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_dimensional_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: replay_2_gold_facts
          depends_on:
            - task_key: replay_2_silver
          notebook_task:
            notebook_path: ${workspace.file_path}/superstore_orchestrator/layer_orchestrator/superstore_gold_facts_ETL_pipeline_orchestrator
            base_parameters:
              SUPERSTORE_ENV: "integration_test"
              SUPERSTORE_PIPELINE_NAME: ${var.SUPERSTORE_PIPELINE_NAME}
              SUPERSTORE_PIPELINE_VERSION: ${var.SUPERSTORE_PIPELINE_VERSION}
              master_run_id: "{{tasks.superstore_pipeline_master_run_id_init.values.master_run_id}}"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"
            source: WORKSPACE
          environment_key: integration_test_environment


        - task_key: assert_replay
          depends_on:
            - task_key: replay_2_gold_dims
            - task_key: replay_2_gold_facts
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/assert_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        # 7. There is deliberately NO end-of-run cleanup.
        #
        # reset_environment (task 0) already guarantees a clean start, so a
        # cleanup task here would be functionally redundant -- its only remaining
        # purpose would be tidiness, and its side effect is destroying the
        # evidence of whatever just happened.
        #
        # That side effect is not hypothetical. On 2026-08-20 two separate
        # investigations stalled because the schemas were gone:
        #
        #   - assert_schema_drift reported SCHEMA_DRIFT_ASSERTIONS_OK rows=3
        #     while silently reading DEV. One query against a surviving
        #     integration_test_metrics.schema_drift would have shown it empty and
        #     exposed the bug immediately. It took two more suite cycles instead.
        #   - a schema-drift discrepancy could not be measured at all, so it was
        #     reasoned about from Auto Loader configuration -- wrongly, twice.
        #
        # Both were GREEN runs. A cleanup that ran only on failure would not have
        # helped either of them, which is why "clean up on success" was rejected
        # as a half-measure.
        #
        # What persists: roughly 25-30 tables across nine schemas, from a NINE
        # ROW seed. It does not accumulate -- reset_environment drops and
        # recreates them every run, so this is one run's state held constant, not
        # growth. Nine rows is not a storage argument, and the schemas are
        # self-describing enough not to be mistaken for real data.
        #
        # One smaller benefit: the cleanup notebook's schema list was wrong once
        # already -- it omitted features and semantic_layer, and those two
        # schemas survived every run unnoticed until 98337a2. That list now
        # matters in exactly one place (task 0) instead of two.

      # The integration_test_* schemas and raw volume are GLOBAL, not per-run, so
      # two simultaneous runs corrupt each other: one seeds while the other's
      # reset_environment drops the schemas underneath it. Observed when a manual run
      # overlapped one already in flight — bronze read 16 rows for a 9-row seed,
      # and every downstream assertion failed for that reason alone.
      # queue + max_concurrent_runs: 1 makes the second run wait instead.
      max_concurrent_runs: 1

      queue:
        enabled: true
      environments:
        - environment_key: integration_test_environment
          spec:
            environment_version: "5"

      email_notifications:
        on_failure:
          - bireshmoktan@gmail.com
        no_alert_for_skipped_runs: true

      performance_target: PERFORMANCE_OPTIMIZED
