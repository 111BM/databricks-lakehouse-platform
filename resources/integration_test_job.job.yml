resources:
  jobs:
    superstore_integration_test:
      name: superstore_integration_test_${bundle.target}
      description: |
        Integration test. Seeds deliberately-dirty data into an isolated volume,
        runs the REAL pipeline against isolated integration_test_* schemas
        (SUPERSTORE_ENV=integration_test), then asserts correctness per layer:
        bronze / silver / gold each run as their own task so failures point to
        the exact layer. Cleanup always runs.

        Run:   databricks bundle run superstore_integration_test --target qa
        A failed assertion fails its task -> fails the job (non-zero exit) so CI
        can block the merge.

        Notebook paths are bundle-relative (${workspace.file_path}) so the job
        reads the code the bundle deployed for the target. Assert notebooks get
        a helpers_path parameter pointing at the deployed _helpers folder.

      tasks:
        # 1. Seed dirty data into the isolated raw volume
        - task_key: seed_initial_data 
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/01_seed_integration_data
            source: WORKSPACE
          environment_key: integration_test_environment

        # 2. Run the REAL pipeline, routed to integration_test_* schemas
        - task_key: run_pipeline_initial_load
          depends_on:
            - task_key: seed_initial_data 
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "incremental"
              start_date: ""
              end_date: ""
              dry_run: "false"

        # 3. Per-layer assertions (fan out from a single pipeline run)
        - task_key: assert_bronze
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/bronze/assert_bronze
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_silver
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/silver/assert_silver
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_gold_dim
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_dim
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        - task_key: assert_gold_fact
          depends_on:
            - task_key: run_pipeline_initial_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_fact
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        # 4. Second incremental load: seed a changed + an unchanged customer
        - task_key: seed_changed_data
          depends_on:
            - task_key: assert_bronze
            - task_key: assert_silver
            - task_key: assert_gold_dim
            - task_key: assert_gold_fact
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/02_seed_scd2_change
            source: WORKSPACE
          environment_key: integration_test_environment

        - task_key: run_pipeline_incremental_load
          depends_on:
            - task_key: seed_changed_data
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "incremental"
              start_date: ""
              end_date: ""
              dry_run: "false"

        # 5. Assert SCD2 change detection + idempotency
        - task_key: assert_scd2_change
          depends_on:
            - task_key: run_pipeline_incremental_load
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/gold/assert_scd2_change
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              # Production module, not a test helper: the four-term reconciliation
              # check runs HERE because this is the only point in the suite where
              # the state is still incremental and the shortfall exists.
              shared_utils_path: ${workspace.file_path}/src/superstore_shared_utilities
          environment_key: integration_test_environment

        # 6. Replay leg. The suite ran `incremental` only, so every windowed-mode
        #    defect was invisible to it — an append-only quarantine that doubled
        #    on every replay, and a Gold dimension window on the wrong clock that
        #    selected zero rows and reported success. Both were green in CI.
        #
        #    The window is derived from the ingested data and passed as a task
        #    value, not hard-coded: the seed lands "now", so a fixed or
        #    job-start date would quietly miss if a run crossed midnight UTC.
        #    Two replays, not one. Idempotency is a replay-vs-replay property:
        #    a replay processes the window as ONE batch where the incremental
        #    loads used several, so it legitimately reclassifies rows between
        #    Silver and audit (the sum is preserved, the partition is not).
        #    Comparing a replay against the incremental state fails on correct
        #    behaviour — the first version of this leg did exactly that.
        - task_key: snapshot_before_replay
          depends_on:
            - task_key: assert_scd2_change
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/03_snapshot_before_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              phase: "incremental"
          environment_key: integration_test_environment

        - task_key: run_pipeline_replay_1
          depends_on:
            - task_key: snapshot_before_replay
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"

        - task_key: snapshot_after_replay_1
          depends_on:
            - task_key: run_pipeline_replay_1
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/03_snapshot_before_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
              phase: "replay_1"
          environment_key: integration_test_environment

        - task_key: run_pipeline_replay_2
          depends_on:
            - task_key: snapshot_after_replay_1
          run_job_task:
            job_id: ${resources.jobs.superstore_data_platform.id}
            job_parameters:
              SUPERSTORE_ENV: "integration_test"
              run_mode: "replay"
              start_date: "{{tasks.snapshot_before_replay.values.replay_start}}"
              end_date: "{{tasks.snapshot_before_replay.values.replay_end}}"
              dry_run: "false"

        - task_key: assert_replay
          depends_on:
            - task_key: run_pipeline_replay_2
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/assert_replay
            source: WORKSPACE
            base_parameters:
              helpers_path: ${workspace.file_path}/tests/integration_databricks/_helpers
          environment_key: integration_test_environment

        # 7. Always clean up (even if an assertion failed)
        - task_key: cleanup
          depends_on:
            - task_key: assert_replay
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/integration_databricks/04_cleanup_integration
            source: WORKSPACE
          environment_key: integration_test_environment

      # The integration_test_* schemas and raw volume are GLOBAL, not per-run, so
      # two simultaneous runs corrupt each other: one seeds while the other's
      # cleanup drops the schemas underneath it. Observed when a manual run
      # overlapped one already in flight — bronze read 16 rows for a 9-row seed,
      # and every downstream assertion failed for that reason alone.
      # queue + max_concurrent_runs: 1 makes the second run wait instead.
      max_concurrent_runs: 1

      queue:
        enabled: true
      environments:
        - environment_key: integration_test_environment
          spec:
            environment_version: "5"

      email_notifications:
        on_failure:
          - bireshmoktan@gmail.com
        no_alert_for_skipped_runs: true

      performance_target: PERFORMANCE_OPTIMIZED
